# How this app goes from a commit to live on Nexlayer.
# Written by Nexlayer from what it read in this repo; owned by your coding
# agent from here. Every agent and CI runs exactly this. Secret VALUES are
# never written here.
app: buzz
deploy:
  config: nexlayer.yaml   # a draft, added by this plan — check it
  environment: ~   # set by the first deploy
  through: nexlayer-mcp          # validate -> deploy -> status; nothing deploys around it
build:
  - pod: relay             # the nexlayer.yaml pod that runs it
    image: buzz-relay         # registry.nexlayer.io/<your user id>/buzz-relay:<tag>
    context: .
    dockerfile: Dockerfile
    platform: linux/amd64
    tag: git-sha                 # immutable; "latest" is rejected
    # read from `Dockerfile`
services:
  - name: relay
    port: 3000
    public: true   # read from `.nexlayer/drafts/nexlayer.yaml`
  - name: postgres
    image: 'mirror.gcr.io/library/postgres:17-alpine'
    port: 5432
    public: false   # read from `.nexlayer/drafts/nexlayer.yaml`
  - name: redis
    image: 'mirror.gcr.io/library/redis:7-alpine'
    port: 6379
    public: false   # read from `.nexlayer/drafts/nexlayer.yaml`
  - name: typesense
    image: 'mirror.gcr.io/typesense/typesense:28.0'
    port: 8108
    public: false   # read from `.nexlayer/drafts/nexlayer.yaml`
  - name: minio
    image: 'mirror.gcr.io/minio/minio:latest'
    port: 9000
    public: false   # read from `.nexlayer/drafts/nexlayer.yaml`
verify:                         # done means all of these pass
  - service: relay
    status: running             # nexlayer_check_deployment_status
  - service: postgres
    status: running             # nexlayer_check_deployment_status
  - service: redis
    status: running             # nexlayer_check_deployment_status
  - service: typesense
    status: running             # nexlayer_check_deployment_status
  - service: minio
    status: running             # nexlayer_check_deployment_status
  - url: /                       # the live URL answers 2xx/3xx with a real page
secrets:                        # names only — values live in Nexlayer
  - name: TYPESENSE_API_KEY
    status: needed_from_human
  - name: KEYCLOAK_ADMIN_PASSWORD
    status: needed_from_human
  - name: BUZZ_S3_ACCESS_KEY
    status: optional
  - name: BUZZ_S3_SECRET_KEY
    status: optional
  - name: PGPASSWORD
    status: optional
rollback: redeploy the previous image tag from the Nexlayer deploy history
notes:                          # from the analysis — keep what holds, fix what doesn't
  - 'One service per pod: relay, postgres, redis, typesense, keycloak, adminer, and the push gateway each run in their own pod.'
  - 'Inter-pod communication uses <podName>.pod:<port>: the relay reaches Postgres at postgres.pod:5432, Redis at redis.pod:6379, and Typesense at typesense.pod:8108 — never localhost or bare hostnames.'
  - 'Postgres is a separate pod from the relay (Rule 4) and persists via PGDATA volume; run migrations (migrations/ dir) against postgres.pod:5432 before/onsstartup.'
  - 'Postgres, Redis, and Adminer images were rewritten from Docker Hub to mirror.gcr.io/library/*; Keycloak stays on quay.io (not Docker Hub); Typesense is mirrored via mirror.gcr.io/typesense/typesense.'
  - 'Keycloak runs in start-dev / dev-mem mode per docker-compose.yml; production should switch KC_DB to the postgres pod and set real admin credentials.'
  - 'The relay image (ghcr.io/block/buzz) bundles the buzz-relay Rust binary plus the static buzz-web frontend and requires git in the runtime image for repository operations.'
