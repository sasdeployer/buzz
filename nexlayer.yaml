application:
  name: neat-peak-buzz
  pods:
    - name: app
      image: "registry.nexlayer.io/user_01kdnssb5ktgqr1mawtnz48s00/buzz:1a02234cc74"
      path: /
      servicePorts:
        - 3000
      vars:
        DATABASE_URL: "postgresql://app:${POSTGRES_PASSWORD}@postgres.pod:5432/app"
        POSTGRES_DB: "app"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_USER: "app"
        REDIS_URL: "redis://redis.pod:6379"
    - name: postgres
      image: mirror.gcr.io/library/postgres:16-alpine
      servicePorts:
        - 5432
      vars: {}
    - name: redis
      image: mirror.gcr.io/library/redis:7-alpine
      servicePorts:
        - 6379
      vars: {}
